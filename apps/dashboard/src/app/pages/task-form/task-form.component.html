<div class="max-w-lg bg-white dark:bg-gray-800 shadow-lg rounded-xl p-4 sm:p-8 mt-4 sm:mt-8 mx-4 sm:mx-auto transition-colors duration-300">
  <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-gray-100">
    {{ isEditMode ? 'Update Task' : 'Add Task' }}
  </h2>

  <form *ngIf="taskForm" [formGroup]="taskForm" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label for="title" class="block font-semibold mb-1 dark:text-gray-200">Title:</label>
      <input id="title" formControlName="title" class="w-full border dark:border-gray-600 px-3 py-2 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" name="title" required />
      <div *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched" class="text-red-500 text-sm">
        Title is required.
      </div>
    </div>
    <div class="mb-4">
      <label for="category" class="block font-semibold mb-1 dark:text-gray-200">Category:</label>
      <select id="category" formControlName="category" class="w-full border dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" name="category" required>
        <option value="">-- Select --</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>
    <div class="mb-4">
      <label for="taskStatus" class="block font-semibold mb-1 dark:text-gray-200">Status:</label>
      <select id="taskStatus" formControlName="taskStatus" class="w-full border dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" name="taskStatus" required >
        <option value="">-- Select --</option>
        <option *ngFor="let stat of statuses" [value]="stat">{{ stat }}</option>
      </select>
    </div>
    <div class="mb-4">
      <label for="dueDate" class="block font-semibold mb-1 dark:text-gray-200">Due Date</label>
      <input id="dueDate" type="date" formControlName="dueDate" class="w-full border dark:border-gray-600 px-3 py-2 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" />
    </div>
    <div class="mb-4">
      <label for="description" class="block font-semibold mb-1 dark:text-gray-200">Description</label>
      <textarea id="description" formControlName="description" rows="3" class="w-full border dark:border-gray-600 px-3 py-2 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100"></textarea>
    </div>
    <div class="flex gap-4 mt-6">
      <button
        type="submit"
        class="bg-blue-600 text-white px-6 py-2 rounded-lg shadow hover:bg-blue-700 font-semibold w-full"
        [disabled]="taskForm.invalid">
        {{ isEditMode ? 'Update Task' : 'Add Task' }}
      </button>
      <button
        type="button"
        class="bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 px-6 py-2 rounded-lg shadow hover:bg-gray-400 dark:hover:bg-gray-500 font-semibold w-full"
        (click)="showTaskBoard()">
        Cancel
      </button>
    </div>
  </form>
</div>

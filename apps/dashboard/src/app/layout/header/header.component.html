<header class="bg-blue-600 dark:bg-gray-800 text-white transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-bold">Task Management</h1>

      <!-- Desktop Navigation -->
      <div class="hidden sm:flex items-center gap-3">
        <!-- Tasks link -->
        <a
          *ngIf="canViewTasks"
          routerLink="/tasks"
          routerLinkActive="underline"
          class="text-white font-semibold px-3 py-2 rounded hover:bg-white/20 transition no-underline"
        >
          Tasks
        </a>
        <!-- Audit Log link -->
        <a
          *ngIf="canViewAuditLog"
          routerLink="/audit-log"
          routerLinkActive="underline"
          class="text-white font-semibold px-3 py-2 rounded hover:bg-white/20 transition no-underline"
        >
          Audit Log
        </a>

        <!-- Theme Toggle Button -->
        <button
          (click)="themeService.toggleTheme()"
          class="bg-white/20 hover:bg-white/30 text-white p-2 rounded-full transition"
          [title]="themeService.isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
          aria-label="Toggle theme"
        >
          <svg *ngIf="themeService.isDarkMode" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg *ngIf="!themeService.isDarkMode" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>

        <button
          (click)="logout()"
          class="bg-white text-blue-600 dark:text-gray-800 font-semibold px-4 py-2 rounded shadow hover:bg-blue-100 transition"
        >
          Logout
        </button>
      </div>

      <!-- Mobile: Theme Toggle + Hamburger -->
      <div class="flex sm:hidden items-center gap-2">
        <button
          (click)="themeService.toggleTheme()"
          class="bg-white/20 hover:bg-white/30 text-white p-2 rounded-full transition"
          [title]="themeService.isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
          aria-label="Toggle theme"
        >
          <svg *ngIf="themeService.isDarkMode" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg *ngIf="!themeService.isDarkMode" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <!-- Hamburger Button -->
        <button
          (click)="mobileMenuOpen = !mobileMenuOpen"
          class="bg-white/20 hover:bg-white/30 text-white p-2 rounded transition"
          aria-label="Toggle menu"
        >
          <svg *ngIf="!mobileMenuOpen" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg *ngIf="mobileMenuOpen" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div *ngIf="mobileMenuOpen" class="sm:hidden bg-blue-700 dark:bg-gray-900 px-4 pb-3 flex flex-col gap-1 border-t border-white/20">
      <a
        *ngIf="canViewTasks"
        routerLink="/tasks"
        routerLinkActive="bg-white/20"
        (click)="mobileMenuOpen = false"
        class="text-white font-semibold px-3 py-2 rounded hover:bg-white/20 transition no-underline"
      >
        Tasks
      </a>
      <a
        *ngIf="canViewAuditLog"
        routerLink="/audit-log"
        routerLinkActive="bg-white/20"
        (click)="mobileMenuOpen = false"
        class="text-white font-semibold px-3 py-2 rounded hover:bg-white/20 transition no-underline"
      >
        Audit Log
      </a>
      <button
        (click)="logout()"
        class="bg-white text-blue-600 dark:text-gray-800 font-semibold px-4 py-2 rounded shadow hover:bg-blue-100 transition text-left mt-1"
      >
        Logout
      </button>
    </div>
</header>
